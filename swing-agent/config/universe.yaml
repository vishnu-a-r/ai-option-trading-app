source: nifty_500
refresh: monthly              # index rebalances - never hardcode constituents

exclusions:
  surveillance: [ASM, GSM]
  segments: [T2T]
  circuit_locked: true
  min_avg_traded_value_cr: 10 # 20-day average
  min_price: null

fno_universe:
  # NOT a universe filter. The system is long-only (SPEC.md section 4), so the
  # full Nifty 500 is tradeable. This list only marks where futures confirmation
  # is AVAILABLE - roughly 180 of the 500. Names outside it are scored on the
  # families that do apply, with weights renormalised; they are not penalised
  # for lacking a futures signal.
  source: nse_fno_list
  refresh: monthly
